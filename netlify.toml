[build]
  publish = "."
  functions = "netlify/functions"

# Optional passthrough for the NAPR WMS endpoints.
# Not required (the upstream sends Access-Control-Allow-Origin: *) — see USE_PROXY in index.html.
[[redirects]]
  from = "/api/wms-proxy"
  to = "/.netlify/functions/wms-proxy"
  status = 200
