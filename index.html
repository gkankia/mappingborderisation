<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="utf-8" />
  <title>Mapbox Historical Soviet Topo WMS Layers</title>
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
  <link rel="icon" href="data:," />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Noto+Sans+Georgian:wght@400;500;700&display=swap" rel="stylesheet">

  <script src="https://api.mapbox.com/mapbox-gl-js/v3.28.1/mapbox-gl.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.28.1/mapbox-gl.css" rel="stylesheet" />

  <script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-compare/v0.6.0/mapbox-gl-compare.js"></script>
  <link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-compare/v0.6.0/mapbox-gl-compare.css" type="text/css" />

  <style>
    :root {
      --bg-panel: rgba(255, 255, 255, 0.95);
      --border-panel: rgba(255, 255, 255, 0.85);
      --primary: #1a73e8;
      --text-main: #202124;
      --text-muted: #5f6368;
      --shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.18), 0 4px 12px rgba(0, 0, 0, 0.1);
      --radius: 16px;
    }

    body {
      margin: 0; padding: 0;
      font-family: 'Google Sans', 'Noto Sans Georgian', sans-serif;
      color: var(--text-main); background-color: #0e1726;
    }

    #map-wrapper { position: absolute; top: 0; bottom: 0; width: 100%; }
    .map { position: absolute; top: 0; bottom: 0; width: 100%; }
    #right-map { display: none; }

    #panel-container {
      position: absolute; top: 20px; right: 20px; z-index: 10;
      display: flex; flex-direction: column; align-items: flex-end;
    }

    #panel-toggle-btn {
      background: var(--bg-panel); backdrop-filter: blur(16px);
      border: 1px solid var(--border-panel); padding: 9px 12px;
      border-radius: 24px; box-shadow: var(--shadow);
      color: var(--text-main); cursor: pointer;
      display: flex; align-items: center; gap: 6px; transition: all 0.25s ease;
    }

    #panel-toggle-btn .layers-icon {
      width: 19px; height: 19px; display: block;
      stroke: currentColor; fill: none;
      stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round;
    }

    .toggle-icon {
      width: 8px; height: 8px; border-right: 2px solid var(--text-muted);
      border-bottom: 2px solid var(--text-muted); transform: rotate(45deg);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1); margin-left: 4px;
    }

    #panel-container.collapsed .toggle-icon { transform: rotate(-135deg); }

    #layer-panel {
      background: var(--bg-panel); backdrop-filter: blur(16px);
      border: 1px solid var(--border-panel); padding: 20px;
      border-radius: var(--radius); box-shadow: var(--shadow); width: 340px;
      max-height: 80vh; display: flex; flex-direction: column; box-sizing: border-box;
      margin-top: 10px; transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #panel-container.collapsed #layer-panel {
      opacity: 0; visibility: hidden; transform: translateY(-12px);
      pointer-events: none; height: 0; padding: 0; margin-top: 0; overflow: hidden; border: none;
    }

    .layer-scroll-area { overflow-y: auto; flex: 1 1 auto; min-height: 0; padding-right: 4px; margin-right: -4px; }
    .control-card { background: rgba(255, 255, 255, 0.7); border: 1px solid rgba(0, 0, 0, 0.05); border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; }
    .layer-header { display: flex; justify-content: space-between; align-items: center; }
    .layer-title-group { display: flex; align-items: center; gap: 10px; }
    .layer-name { font-weight: 500; font-size: 13px; }

    .switch { position: relative; display: inline-block; width: 36px; height: 20px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider-switch { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #bdc1c6; transition: .25s; border-radius: 20px; }
    .slider-switch:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .25s; border-radius: 50%; }
    input:checked + .slider-switch { background-color: var(--primary); }
    input:checked + .slider-switch:before { transform: translateX(16px); }

    .opacity-value { font-size: 11.5px; font-weight: 600; color: var(--text-muted); min-width: 34px; text-align: right; }
    .slider-wrapper { margin-top: 8px; display: flex; align-items: center; }
    .opacity-slider { -webkit-appearance: none; width: 100%; height: 4px; border-radius: 2px; background: #e0e0e0; outline: none; }
    .opacity-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--primary); cursor: pointer; }

    #split-btn { width: 100%; margin-top: 12px; padding: 10px 14px; border-radius: 10px; border: none; background-color: #e8f0fe; color: var(--primary); font-weight: 600; font-size: 13px; cursor: pointer; }
    #split-btn:disabled { background-color: #f1f3f4; color: #3c4043; opacity: 0.6; cursor: not-allowed; }
    #split-btn.active { background-color: #d93025; color: #ffffff; }

    /* Which layer each half of the comparison is showing. These must live in
       #map-wrapper, not inside the map containers — mapbox-gl-compare sets a CSS
       `clip` on each container, which would crop anything nested inside them.
       Sat above the Mapbox logo/attribution so neither is obscured. */
    #split-labels { display: none; }
    #split-labels.active { display: block; }
    .split-label {
      position: absolute; bottom: 48px; z-index: 9;
      background: var(--bg-panel); backdrop-filter: blur(16px);
      border: 1px solid var(--border-panel); box-shadow: var(--shadow);
      padding: 7px 14px; border-radius: 20px;
      font-size: 12.5px; font-weight: 600; color: var(--text-main);
      max-width: 42%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      pointer-events: none;
    }
    .split-label-left { left: 12px; }
    .split-label-right { right: 12px; }

  </style>
</head>
<body>

  <div id="map-wrapper">
    <div id="left-map" class="map"></div>
    <div id="right-map" class="map"></div>
    <div id="split-labels">
      <span id="left-label" class="split-label split-label-left"></span>
      <span id="right-label" class="split-label split-label-right"></span>
    </div>
  </div>

  <div id="panel-container" class="collapsed">
    <button id="panel-toggle-btn" aria-label="რუკის ფენები" title="რუკის ფენები">
      <!-- Placeholder layers symbol: replace this <svg> with the one from the project
           folder (keep class="layers-icon" so the sizing and colour rules still apply). -->
      <svg class="layers-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 2.75 2.75 7.5 12 12.25 21.25 7.5 12 2.75Z"/>
        <path d="M2.75 12.5 12 17.25 21.25 12.5"/>
        <path d="M2.75 17 12 21.75 21.25 17"/>
      </svg>
      <span class="toggle-icon"></span>
    </button>
    <div id="layer-panel">
      <div class="layer-scroll-area" id="layer-list"></div>
      <button id="split-btn" disabled>შედარების ჩართვა</button>
    </div>
  </div>

  <script>
    mapboxgl.accessToken = 'pk.eyJ1Ijoiam9yam9uZTkwIiwiYSI6ImNrZ3R6M2FvdTBwbmwycXBibGRqM2w2enYifQ.BxjvFSGqefuC9yFCrXC-nQ';
    const STYLE_URL = 'mapbox://styles/jorjone90/cmt0iv5hs001101sgcqdrhheh';
    // [west, south, east, north] — full extent of Georgia
    const GEORGIA_BOUNDS = [39.9, 41.0, 46.8, 43.65];

    // The topo sheets are served by NAPR, one GeoServer workspace per dataset.
    // The upstream sends Access-Control-Allow-Origin: *, so the browser can hit it
    // directly; flip USE_PROXY to true to route through /api/wms-proxy instead.
    const USE_PROXY = false;
    const WMS_HOST = 'https://mp.napr.gov.ge';

    // Fill layer defined in the Mapbox Studio style that must keep drawing above
    // the rasters — every layer we add is inserted underneath it.
    const COVER_FILL_LAYER = 'soviet-topo-cover-fill';

    function buildWmsUrl(workspace, layerName) {
      const queryParams = new URLSearchParams({
        SERVICE: 'WMS',
        VERSION: '1.1.1',
        REQUEST: 'GetMap',
        LAYERS: layerName,
        STYLES: '',            // required by this server — omitting it returns HTTP 500
        FORMAT: 'image/png',
        TRANSPARENT: 'TRUE',
        SRS: 'EPSG:3857',
        WIDTH: '256',
        HEIGHT: '256'
      });
      const base = USE_PROXY
        ? `/api/wms-proxy?ws=${encodeURIComponent(workspace)}&`
        : `${WMS_HOST}/${workspace}/ows?`;
      return `${base}${queryParams.toString()}&BBOX={bbox-epsg-3857}`;
    }

    // `studio: true` means the layer already exists in the Studio style and only
    // needs toggling; the rest are added as WMS raster sources at runtime.
    // `label` names the layer in the control panel (survey year); `scale` is what the
    // split-view badge shows. `studio: true` means the layer already exists in the
    // Studio style and only needs toggling.
    const LAYERS_CONFIG = {
      map1922:   { id: '1922-map',       label: '1922 წლის რუკა',       studio: true },
      topo10k:   { id: 'wms-topo-10k',   label: 'საბჭოთა ტოპო 1952',    scale: '1:10,000',    ws: 'TOPO_10k_1952_2007',  layer: 'TOPO_10000_1952_2007' },
      topo25k:   { id: 'wms-topo-25k',   label: 'საბჭოთა ტოპო 1953',    scale: '1:25,000',    ws: 'TOPO_25k_1953-2004',  layer: 'TOPO_25000_1953-2004' },
      topo50k:   { id: 'wms-topo-50k',   label: 'საბჭოთა ტოპო 1973',    scale: '1:50,000',    ws: 'TOPO_50k_1973-1990',  layer: 'TOPO_50000_1973_1990' },
      topo100k:  { id: 'wms-topo-100k',  label: 'საბჭოთა ტოპო 1978',    scale: '1:100,000',   ws: 'TOPO_100K_1978_1990', layer: 'TOPO_100000' },
      topo200k:  { id: 'wms-topo-200k',  label: 'საბჭოთა ტოპო 1981',    scale: '1:200,000',   ws: 'TOPO_200k_1981_1990', layer: 'TOPO_200000' },
      topo500k:  { id: 'wms-topo-500k',  label: 'საბჭოთა ტოპო 1989',    scale: '1:500,000',   ws: 'TOPO_500k_1989',      layer: 'TOPO_500000' },
      topo1000k: { id: 'wms-topo-1000k', label: 'საბჭოთა ტოპო 1988',    scale: '1:1,000,000', ws: 'TOPO_1000k_1988-90',  layer: 'TOPO_1000000' }
    };

    // The 1922 sheet has no scale, so it falls back to its panel name.
    const splitLabelFor = cfg => cfg.scale || cfg.label;

    // Derive the control ids from the key so markup and config cannot drift apart.
    Object.entries(LAYERS_CONFIG).forEach(([key, cfg]) => {
      cfg.toggleId = `toggle-${key}`;
      cfg.opacityId = `opacity-${key}`;
      cfg.valId = `val-${key}`;
    });

    document.getElementById('layer-list').innerHTML = Object.values(LAYERS_CONFIG).map(cfg => `
      <div class="control-card">
        <div class="layer-header">
          <div class="layer-title-group">
            <label class="switch"><input type="checkbox" id="${cfg.toggleId}"><span class="slider-switch"></span></label>
            <span class="layer-name">${cfg.label}</span>
          </div>
          <span id="${cfg.valId}" class="opacity-value">100%</span>
        </div>
        <div class="slider-wrapper"><input type="range" id="${cfg.opacityId}" class="opacity-slider" min="0" max="100" value="100"></div>
      </div>`).join('');

    const leftMap = new mapboxgl.Map({
      container: 'left-map',
      style: STYLE_URL,
      center: [43.290225, 42.375224],
      zoom: 7
    });

    let rightMap = null;
    let compareInstance = null;
    let isSplitActive = false;
    let isLeftLoaded = false;

    const panelContainer = document.getElementById('panel-container');
    const panelToggleBtn = document.getElementById('panel-toggle-btn');
    const splitBtn = document.getElementById('split-btn');
    const splitLabels = document.getElementById('split-labels');
    const leftLabel = document.getElementById('left-label');
    const rightLabel = document.getElementById('right-label');

    panelToggleBtn.addEventListener('click', () => panelContainer.classList.toggle('collapsed'));

    function setupWmsSourcesAndLayers(mapInstance) {
      if (!mapInstance) return;
      // Anchor every raster below the cover fill so that fill stays on top.
      const beforeId = mapInstance.getLayer(COVER_FILL_LAYER) ? COVER_FILL_LAYER : undefined;
      Object.values(LAYERS_CONFIG).forEach(cfg => {
        if (cfg.studio) return;   // already present in the Studio style
        const sourceId = `${cfg.id}-src`;
        if (!mapInstance.getSource(sourceId)) {
          mapInstance.addSource(sourceId, {
            type: 'raster',
            tiles: [buildWmsUrl(cfg.ws, cfg.layer)],
            tileSize: 256,
            bounds: GEORGIA_BOUNDS
          });
        }
        if (!mapInstance.getLayer(cfg.id)) {
          mapInstance.addLayer({
            id: cfg.id,
            type: 'raster',
            source: sourceId,
            layout: { visibility: 'none' },
            paint: { 'raster-opacity': 1.0 }
          }, beforeId);
        }
      });
    }

    leftMap.on('style.load', () => {
      isLeftLoaded = true;
      setupWmsSourcesAndLayers(leftMap);
    });

    function getSelectedKeys() {
      return Object.keys(LAYERS_CONFIG).filter(key => document.getElementById(LAYERS_CONFIG[key].toggleId)?.checked);
    }

    function updateUIState() {
      if (!isLeftLoaded) return;
      const selectedKeys = getSelectedKeys();
      splitBtn.disabled = selectedKeys.length !== 2;

      if (selectedKeys.length !== 2 && isSplitActive) {
        disableSplitMode();
      } else if (!isSplitActive) {
        Object.keys(LAYERS_CONFIG).forEach(key => {
          const cfg = LAYERS_CONFIG[key];
          const isChecked = selectedKeys.includes(key);
          if (leftMap.getLayer(cfg.id)) {
            leftMap.setLayoutProperty(cfg.id, 'visibility', isChecked ? 'visible' : 'none');
          }
        });
      }
    }

    splitBtn.addEventListener('click', () => isSplitActive ? disableSplitMode() : enableSplitMode());

    function enableSplitMode() {
      const selectedKeys = getSelectedKeys();
      if (selectedKeys.length !== 2) return;

      isSplitActive = true;
      splitBtn.textContent = 'შედარების გათიშვა';
      splitBtn.classList.add('active');
      document.getElementById('right-map').style.display = 'block';
      splitLabels.classList.add('active');

      if (!rightMap) {
        rightMap = new mapboxgl.Map({
          container: 'right-map',
          style: STYLE_URL,
          center: leftMap.getCenter(),
          zoom: leftMap.getZoom()
        });
        rightMap.once('style.load', () => {
          setupWmsSourcesAndLayers(rightMap);
          applySplitVisibilities(selectedKeys);
          compareInstance = new mapboxgl.Compare(leftMap, rightMap, '#map-wrapper', {});
        });
      } else {
        applySplitVisibilities(selectedKeys);
        compareInstance = new mapboxgl.Compare(leftMap, rightMap, '#map-wrapper', {});
      }
    }

    function applySplitVisibilities(selectedKeys) {
      const [leftKey, rightKey] = selectedKeys;
      leftLabel.textContent = splitLabelFor(LAYERS_CONFIG[leftKey]);
      rightLabel.textContent = splitLabelFor(LAYERS_CONFIG[rightKey]);
      Object.keys(LAYERS_CONFIG).forEach(key => {
        const id = LAYERS_CONFIG[key].id;
        if (leftMap.getLayer(id)) leftMap.setLayoutProperty(id, 'visibility', key === leftKey ? 'visible' : 'none');
        if (rightMap?.getLayer(id)) rightMap.setLayoutProperty(id, 'visibility', key === rightKey ? 'visible' : 'none');
      });
    }

    function disableSplitMode() {
      isSplitActive = false;
      splitBtn.textContent = 'შედარების ჩართვა';
      splitBtn.classList.remove('active');
      if (compareInstance) { compareInstance.remove(); compareInstance = null; }
      document.getElementById('right-map').style.display = 'none';
      splitLabels.classList.remove('active');
      updateUIState();
      leftMap.resize();
    }

    Object.keys(LAYERS_CONFIG).forEach(key => {
      const cfg = LAYERS_CONFIG[key];
      document.getElementById(cfg.toggleId)?.addEventListener('change', updateUIState);
      document.getElementById(cfg.opacityId)?.addEventListener('input', (e) => {
        document.getElementById(cfg.valId).textContent = `${e.target.value}%`;
        const val = parseFloat(e.target.value) / 100;
        if (leftMap.getLayer(cfg.id)) leftMap.setPaintProperty(cfg.id, 'raster-opacity', val);
        if (rightMap?.getLayer(cfg.id)) rightMap.setPaintProperty(cfg.id, 'raster-opacity', val);
      });
    });
  </script>
</body>
</html>
